# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
# Board names follow ZMK main (HWMv2): nice_nano_v2 -> nice_nano (rev 2.0.0
# default) + required "zmk" variant. nice_view_adapter is NOT used: its default
# SCK (D3/P0.20) collides with the Kyria matrix; SPI is defined by hand in each
# half's .overlay (CS=D1, MOSI=D2, SCK=D9/P1.06).
---
include:
  - board: nice_nano//zmk
    shield: kyria_rev3_left nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano//zmk
    shield: kyria_rev3_right nice_view