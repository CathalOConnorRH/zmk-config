# Uncomment these two line to add support for encoders to your firmware
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Enable the nice!view Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=n
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# nice!view specific settings
# (SHIELD_NICE_VIEW / LS0xx driver / LVGL 1-bit colour / custom status screen
#  are selected by building the nice_view shield — see build.yaml)
# NOTE: no CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE here; the nice_view
# shield defaults it to 4096 (2048 overflows the custom status screen).
CONFIG_SPI=y

# RGB underglow: factory Kyria LED chain (DIN on D1/P0.06) driven by the
# bit-banged ws2812-gpio driver (see kyria_common.dtsi). ZMK's stock kyria
# nice!nano overlay puts the SPI strip on P0.06 — that is disabled there and
# replaced, so the nice!view keeps P0.06 free for whatever it needs.
CONFIG_ZMK_RGB_UNDERGLOW=y
# 31 LEDs @ white-max would draw ~1.9A; nice!voltage tops out ~150mA.
# Cap software brightness (value ~ 100 = 39%; raise once you trust the rail).
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=100

CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

CONFIG_ZMK_SLEEP=y
# Sleep timeout in milliseconds (4 hours)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=14400000

# Display configuration
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Uncomment the following line to enable the Kyria OLED Display
#ZMK_WIDGET_BATTERY_STATUS=n
# CONFIG_ZMK_DISPLAY_INVERT=y