# Left half = split CENTRAL (nice!view tier-1 screen).
#
# Central status screen shows: USB/BT output icon, battery, layer name,
# WPM graph. Composition is hardcoded in the nice!view status widget
# (nice_view/widgets/status.c); the toggles below are the real knobs.

# Explicit: this half computes WPM for its display.
CONFIG_ZMK_WPM=y

# Uncomment to run this display inverted (white-on-black):
# CONFIG_NICE_VIEW_WIDGET_INVERTED=y
